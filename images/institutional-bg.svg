<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a2848"/>
    <stop offset="60%" stop-color="#253260"/>
    <stop offset="100%" stop-color="#1e2a50"/>
  </linearGradient>
  <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2a3870" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#2a3870" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#18202c"/>
    <stop offset="100%" stop-color="#0e141e"/>
  </linearGradient>
  <radialGradient id="moon" cx="82%" cy="12%" r="8%">
    <stop offset="0%" stop-color="#d0d8f0" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#d0d8f0" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<ellipse cx="1600" cy="900" rx="1200" ry="400" fill="url(#horizon)"/>
<rect width="1600" height="900" fill="url(#moon)"/>
<rect y="600" width="1600" height="300" fill="url(#ground)"/>
