<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden – Alexander Kreith · Schadstoffgutachten</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300 600;font-display:swap;src:url('fonts/dm-sans-var.woff2') format('woff2')}
@font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/dm-serif-display-400.woff2') format('woff2')}
@font-face{font-family:'DM Serif Display';font-style:italic;font-weight:400;font-display:swap;src:url('fonts/dm-serif-display-400-italic.woff2') format('woff2')}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F5F2EC;--dark:#1A1A18;--mid:#3D3D38;--muted:#8A8980;--accent:#2E5C3F;--accent-h:#234a31}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;line-height:1.7}
.err-eye{font-size:0.7rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:1.2rem}
.err-code{font-family:'DM Serif Display',serif;font-size:clamp(5rem,18vw,11rem);line-height:0.95;letter-spacing:-0.04em;color:var(--dark);margin-bottom:1rem}
.err-code em{font-style:italic;color:var(--accent)}
h1{font-family:'DM Serif Display',serif;font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-0.02em;margin-bottom:1rem}
p{color:var(--muted);font-size:1rem;max-width:480px;margin-bottom:2.5rem}
.err-actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.btn-primary{display:inline-block;font-size:0.85rem;font-weight:500;color:white;background:var(--accent);padding:0.9rem 2rem;border-radius:2px;text-decoration:none;letter-spacing:0.05em;text-transform:uppercase;transition:background 0.2s;cursor:pointer}
.btn-primary:hover{background:var(--accent-h)}
.btn-ghost{display:inline-block;font-size:0.85rem;font-weight:400;color:var(--mid);padding:0.9rem 1.5rem;text-decoration:none;letter-spacing:0.05em;text-transform:uppercase;border-bottom:1px solid var(--mid);transition:color 0.2s,border-color 0.2s}
.btn-ghost:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
  <div class="err-eye">Fehler</div>
  <div class="err-code">4<em>0</em>4</div>
  <h1>Seite nicht gefunden</h1>
  <p>Die aufgerufene Seite existiert leider nicht oder wurde verschoben. Möglicherweise ist der Link veraltet.</p>
  <div class="err-actions">
    <a class="btn-primary" href="index.html">Zur Startseite</a>
    <a class="btn-ghost" href="index.html#kontakt">Kontakt aufnehmen</a>
  </div>
</body>
</html>
